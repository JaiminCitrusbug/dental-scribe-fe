name: Deploy frontend

on:
  push:
    branches: [pre-develop]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  COMPOSE_FILE: /opt/dental-scribe/docker-compose.yml

jobs:
  deploy:
    # Self-hosted runner registered on the EC2 instance for this repo.
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        # VITE_API_BASE_URL is a repo Actions variable (Settings > Secrets and
        # variables > Actions > Variables) = https://dentalscribe.citrusbug.com
        # — it is baked into the JS bundle at build time.
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            -t dental-scribe-fe:latest .

      - name: Restart frontend
        # --no-deps: never touch the backend container from the frontend deploy
        # (the two repos can deploy at the same time).
        run: docker compose -f "$COMPOSE_FILE" up -d --no-deps frontend

      - name: Smoke check
        # Hit the frontend container directly (loopback :8080). Plain
        # http://localhost/ goes through host nginx, whose certbot port-80
        # block 404s any Host that isn't the real domain.
        run: |
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:8080/ && echo "frontend OK"

      - name: Prune old frontend images
        if: always()
        # Label-scoped so a simultaneous backend deploy is never affected.
        run: docker image prune -f --filter "label=app=dental-scribe-fe"
